name: Repository checks
on:
  pull_request:
  push:
    branches: [main, development, stable]
  workflow_call:

permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'source' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      monitor: ${{ steps.paths.outputs.monitor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'monitor=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            if grep -Eq '^(Makefile$|nicx-router-monitor/|sources/feeds[.]conf$|[.]github/workflows/|scripts/(release|install-packages|package_dashboard))' "$RUNNER_TEMP/changed-files"; then
              echo 'monitor=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: |
          python3 -B -m unittest discover -s scripts/tests -v
          for script in scripts/*.sh; do bash -n "$script"; done
          git diff --check HEAD^ HEAD

  verify:
    needs: scope
    if: needs.scope.outputs.monitor == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nicx-router-monitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm"
      - run: pnpm preflight && pnpm test && pnpm typecheck
      - run: sudo apt-get update && sudo apt-get install -y busybox-static cmake libjson-c-dev
      - run: sh scripts/build-test-jshn.sh "$RUNNER_TEMP/nicx-test-tools"
      - run: echo "NICX_TEST_STAGING=$RUNNER_TEMP/nicx-test-tools" >> "$GITHUB_ENV"
      - run: pnpm test:router
        env:
          NICX_BUSYBOX: /usr/bin/busybox
      - run: python3 tests/router/export_sample.py > "$RUNNER_TEMP/nicx-agent-fixture.json"
        env:
          NICX_BUSYBOX: /usr/bin/busybox
      - run: pnpm test:database
        env:
          NICX_AGENT_SAMPLE: ${{ runner.temp }}/nicx-agent-fixture.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: local-test-public-key
      - if: always()
        run: rm -rf -- "$RUNNER_TEMP/pnpm" "$RUNNER_TEMP/nicx-test-tools" "$RUNNER_TEMP/nicx-agent-fixture.json"

  required:
    name: Required repository checks
    if: always()
    needs: [scope, verify]
    runs-on: ubuntu-latest
    env:
      SCOPE: ${{ needs.scope.result }}
      MONITOR: ${{ needs.verify.result }}
    steps:
      - run: '[[ "$SCOPE" == success && ( "$MONITOR" == success || "$MONITOR" == skipped ) ]]'
